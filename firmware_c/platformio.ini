; SPY-BOT V2 (C++) : ESP32 « esp32dev », Arduino.
;   pio run                                  compiler
;   pio run -t erase  --upload-port COM6     effacer la flash (MicroPython)
;   pio run -t upload --upload-port COM6     flasher
;   pio device monitor --port COM6           voir ce que dit le robot
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.f_cpu = 240000000L
build_flags = -ffp-contract=off -Wall
; Le dossier test/ contient le banc de test sur PC (g++), pas des tests PlatformIO.
test_ignore = *
